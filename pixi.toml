# Dear ImGui shim for `noeira/render/imgui/` (the ImGui dm_control viewer).
# Clones ImGui into third_party/ on first run, then rebuilds only when stale.
# Neither the clone nor the built dylib is tracked, so this is a prerequisite
# of examples/dm_control/dm_viewer_imgui.mojo on a fresh checkout.
build-imgui = { cmd = "bash scripts/build_imgui.sh", description = "Build the Dear ImGui shim (noeira/render/imgui/)" }
# Serial shim for `noeira/io/serial/` (the SO-101 Feetech bus). Six lines of
# C for ONE call Mojo's FFI cannot make: `ioctl` is C-variadic, and on Apple
# arm64 variadic args go on the stack while `external_call` puts them in
# registers -> silent EFAULT. Prerequisite of anything under `noeira/robot/`.
build-serial = { cmd = "bash scripts/build_serial.sh", description = "Build the serial shim (noeira/io/serial/)" }
# HTTP shim for `noeira/io/http.mojo` — libcurl behind a fixed-arity C API.
# Same reason as the serial shim, one level up: `curl_easy_setopt` is
# C-variadic. It also carries zlib's `inflate`, because MNIST ships `.gz`
# URLs, which is a content encoding libcurl will not decode (it is not a
# `Content-Encoding` header). Prerequisite of `RemoteLogger`, the dataset
# catalog, the HF downloader and the MNIST / TinyShakespeare loaders — i.e.
# of every remaining network call in the tree, none of which touch Python.
build-http = { cmd = "bash scripts/build_http.sh", description = "Build the HTTP shim (noeira/io/http.mojo)" }
# qhull shim for `noeira/physics3d/collision/`. MuJoCo does not implement a
# convex hull — `MakeGraph` CALLS qhull and walks `FORALLfacets`, and that
# order decides every polygon normal. Prerequisite of any MESH model.
# OpenCV shim for `noeira/vision/opencv/`. OpenCV has had no C API since 4.x,
# so this is a C++ shim like the ImGui one -- but nothing is vendored: every
# pixi env already carries the full C++ OpenCV 5.0. Groups A (lifecycle) and
# B (capture) today; see docs/OPENCV_SHIM_SCOPE.md. Prerequisite of any camera
# capture from Mojo, which is what the ACT closed-loop rollout is blocked on.
# The vision playground: a live camera (or any video file) in an ImGui window,
# with ArUco detection drawn over it. Needs BOTH shims. Build the binary rather
# than `mojo run` -- it links ResNet-free but still takes ~40 s to compile.
camera-studio = { cmd = "mojo run -I . examples/vision/camera_studio.mojo", depends-on = ["build-imgui", "build-opencv"], description = "Live camera + ArUco playground (examples/vision/camera_studio.mojo)" }
build-opencv = { cmd = "bash scripts/build_opencv.sh", description = "Build the OpenCV shim (noeira/vision/opencv/)" }
calibrate-fisheye = { cmd = "mojo run -I . examples/vision/calibrate_fisheye.mojo", depends-on = ["build-opencv"], description = "Headless fisheye intrinsics for a rig camera (-- --camera /dev/soarm_cam_overhead --name overhead --preview); runs over SSH"}
build-qhull = { cmd = "bash scripts/build_qhull.sh", description = "Build the qhull shim (noeira/physics3d/collision/)" }
# The SO-101 hardware gate: dump both arms from Mojo, diff against
# `tools/soarm/so101_diag.py` (Python + lerobot). Read-only — writes no
# register and never touches torque. Needs the arms plugged in.
soarm-diag = { cmd = "mojo run -I . tools/soarm/so101_mojo_diag.mojo", depends-on = ["build-serial"], description = "Dump both SO-101 arms (read-only hardware gate)" }
# Recovery: release torque on both arms after a control loop died without
# running its cleanup (a kill, a crash). A follower left holding a pose
# resists being moved and heats up.
soarm-torque-off = { cmd = "mojo run -I . tools/soarm/so101_torque_off.mojo", depends-on = ["build-serial"], description = "Release torque on both SO-101 arms" }
