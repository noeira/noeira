libero-task-hooks = { cmd = "mojo run -I . tests/libero/test_libero_task_hooks.mojo", description = "Every LIBERO family: comptime facts (obs width, dims, cone, contact budget, the config's restated constants), the per-step task hooks on every task (device == host == oracle), and LiberoOscConfig[P]'s own hooks" }
