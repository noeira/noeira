[workspace]
authors = ["Denis Laboureyras"]
channels = ["https://conda.modular.com/max-nightly", "conda-forge"]
preview = ["pixi-build"]
name = "noeira"
description = "Dream in simulation. Act in the world. An end-to-end Physical AI stack in Mojo: physics, learning, perception and deployment, from simulator to robot."
platforms = [
    { platform = "linux-64", cuda = "12" },
    { platform = "linux-aarch64", cuda = "12" },
    { platform = "osx-arm64", macos = "15.0" },
]
version = "0.1.0"
license = "MIT"
license-file = "LICENSE"
homepage = "https://github.com/noeira/noeira"
repository = "https://github.com/noeira/noeira"


[feature.nvidia]
channels = ["nvidia"]

[feature.nvidia.target.linux-64.dependencies]
# Pin to 3.13 so the nvidia solve matches apple (osx-arm64 resolves 3.13) AND the
# `libpython3.13.so` activation string below — else Mojo's Python interop aborts
# on the first import (e.g. RemoteLogger.flush → urllib). Box-independent.
python = ">=3.13.14,<3.14"
cuda-toolkit = ">=12.9.2,<13" # for compute-sanitizer etc.
cuda-gdb = ">=12.9.79,<13"     # for GPU kernel debugging
nsight-compute = ">=2025.2.1.3,<2026"  # interactive kernel profiling
cudnn = ">=9.14.0.64,<10"     # cuDNN for conv_gpu/conv_cudnn

[feature.nvidia.activation]
# Use the system ptxas from the CUDA container (/usr/local/cuda/bin/ptxas).
# This bypasses MAX's built-in libnvptxcompiler (tied to CUDA 13 + driver >= 580)
# and works with any CUDA container (12.x or 13.x) on driver >= 570.
# On CUDA 13 containers (RTX 5090): ptxas 13.x → supports sm_120 (Blackwell) ✅
# On CUDA 12.8 containers (RTX 4090): ptxas 12.x → supports sm_89 (Ada) ✅
env = { MODULAR_NVPTX_COMPILER_PATH = "/usr/local/cuda/bin/ptxas", LD_PRELOAD = "$PIXI_PROJECT_ROOT/noeira/cuda/libcuda_intercept.so" }
scripts = ["scripts/build_cuda_intercept.sh"]

# ---------------------------------------------------------------------------
# JETSON — Orin NX 16GB, sm_87, linux-aarch64.
#
# DELIBERATELY NOT `nvidia`. That feature pulls cuda-toolkit / cudnn /
# nsight-compute from the `nvidia` channel; on aarch64 those resolve to SBSA
# (ARM *server*, Grace/Thor) builds, which do not match a Tegra driver. On a
# Jetson the CUDA that matters is the one JetPack already installed in
# /usr/local/cuda — here 12.6 (ptxas V12.6.68, knows sm_87). Adding a conda
# CUDA next to it is how you end up with two toolchains disagreeing about the
# driver, so this feature declares NO cuda package at all.
#
# ⚠ NO `platforms` KEY HERE. `linux-aarch64` is already declared on the
# workspace's own `platforms` list above (with its `cuda = "12"` virtual
# package), and pixi 0.76.1 does NOT cross-check a FEATURE-level
# `platforms = ["linux-aarch64"]` against that table form: it reports
# "feature 'jetson' references platform 'linux-aarch64' which is not declared
# in the workspace" and every environment fails to resolve — apple and cpu
# included, not just this one. The workspace entry is what scopes the solve.
# Everything else (mojo 1.1.0, max 26.6.0, and every conda-forge dep in
# [dependencies]) is published for linux-aarch64 — checked 2026-09-16 — so the
# default feature is inherited as-is.
[feature.jetson]

[feature.jetson.target.linux-aarch64.dependencies]
# Same 3.13 pin and the same reason as the nvidia feature: it has to match the
# `libpython3.13.so` activation string below.
python = ">=3.13.14,<3.14"

[feature.jetson.activation]
# The SAME ptxas indirection as [feature.nvidia.activation], for the same
# reason: it bypasses MAX's built-in libnvptxcompiler (tied to CUDA 13 +
# driver >= 580). JetPack 6.2 ships driver 540.4.0, so WITHOUT this line the
# board would need a JetPack 7.2 reflash — which needs an x86 host, which is
# the thing we are avoiding. /usr/local/cuda/bin/ptxas is JetPack's own.
env = { MODULAR_NVPTX_COMPILER_PATH = "/usr/local/cuda/bin/ptxas", LD_PRELOAD = "$PIXI_PROJECT_ROOT/noeira/cuda/libcuda_intercept.so" }
scripts = ["scripts/build_cuda_intercept.sh"]

[feature.jetson.tasks]
# ⚠ PASS `--target-accelerator sm_87` ON THE BOARD. MAX picks the kernel target
# through NVML (`nvmlDeviceGetCudaComputeCapability`), which Tegra does not
# provide; the fallback target compiles through ptxas without complaint and the
# driver then refuses the image at the first kernel load with
# CUDA_ERROR_INVALID_SOURCE ("device kernel image is invalid"). MAX reads no
# environment variable for the target, so the flag has to be on the command:
#   pixi run -e jetson run-jetson examples/nn/mlp/mlp_mnist_training_storage_gpu.mojo
# Verified 2026-09-16 on the Orin NX: that MLP reaches 97.75% with the flag.
run-jetson = { cmd = "mojo run -I . --target-accelerator sm_87", description = "mojo run for the Orin (sm_87 — MAX cannot detect it without NVML)" }
build-jetson = { cmd = "mojo build -I . --target-accelerator sm_87", description = "mojo build for the Orin (sm_87; AOT needs the flag too)" }

# ── ACT on the board ───────────────────────────────────────────────────────
# ⚠ TWO TASKS, ONE SOURCE, AND THAT IS THE POINT. The inference device is a
# PARAMETER of ACTTrainer, so it is chosen at build time with `-DACT_GPU=1`
# rather than by a runtime flag: a flag would mean instantiating the whole ACT
# graph twice in one binary, and the build is already ~145 s on an M1 Pro —
# paid on the Orin's A78AE cores, which is the slowest compiler in the loop.
#
# ⚠⚠ RUN BOTH AND READ BOTH NUMBERS BEFORE CHOOSING. The "Metal is slower"
# measurement in the deploy script's header is about Metal's command-buffer
# retirement floor on an M1; it says NOTHING about CUDA on a Tegra, where the
# comparison is a weak ARM CPU against 1024 Ampere cores. Each binary prints
# `forward N ms warm` before anything is armed — that line is the measurement.
#
# ⚠ NO `-ld_classic` HERE, unlike the macOS task: that is an ld64 flag and the
# board links with lld.
#   pixi run -e jetson act-deploy-jetson -- --project so101-tower \
#       --devices /dev/soarm_cam_overhead,/dev/soarm_cam_wrist
act-deploy-jetson = { cmd = "mojo build -I . --target-accelerator sm_87 -DACT_GPU=1 -o /tmp/act_deploy_gpu examples/so101/act_so101_deploy_real.mojo && /tmp/act_deploy_gpu", depends-on = ["build-serial", "build-opencv"], description = "ACT on the Orin's GPU (-- --project P; --arm to move it)" }
act-deploy-jetson-cpu = { cmd = "mojo build -I . --target-accelerator sm_87 -o /tmp/act_deploy_cpu examples/so101/act_so101_deploy_real.mojo && /tmp/act_deploy_cpu", depends-on = ["build-serial", "build-opencv"], description = "The same policy on the Orin's CPU — the other half of the A/B" }

# The SIM-TRAINED pixel student (DAgger from a state PPO teacher) on the arm —
# the sim-to-real test. CPU inference: the net is ~2 MFLOP at batch 1. Promote
# a run first: tools/project/promote_pixel_student.sh RUN_ID pixel_lift
#   pixi run -e jetson pixel-deploy-jetson -- --role pixel_lift --snap /tmp/px_snap
#   pixi run -e jetson pixel-deploy-jetson -- --role pixel_lift --arm --seconds 20
pixel-deploy-jetson = { cmd = "mojo build -I . --target-accelerator sm_87 -o /tmp/pixel_deploy examples/so101/pixel_student_deploy_real.mojo && /tmp/pixel_deploy", depends-on = ["build-serial", "build-opencv"], description = "The sim-trained pixel student on the arm (-- --role R; --arm to move it)" }
# the same for a 32x32 student that sees its joint velocities (the build must
# match the student: the manifest refuses a mismatch before anything moves)
pixel-deploy-jetson-v32 = { cmd = "mojo build -I . --target-accelerator sm_87 -D DAGGER_PX_32 -D DAGGER_JOINT_VEL -o /tmp/pixel_deploy_v32 examples/so101/pixel_student_deploy_real.mojo && /tmp/pixel_deploy_v32", depends-on = ["build-serial", "build-opencv"], description = "A 32x32 joint-velocity pixel student on the arm (-- --role R; --arm to move it)" }
# ... and a WINDOWED one (-D DAGGER_WINDOW: the overhead's workspace window,
# the domain-randomised students)
pixel-deploy-jetson-wv32 = { cmd = "mojo build -I . --target-accelerator sm_87 -D DAGGER_WINDOW -D DAGGER_PX_32 -D DAGGER_JOINT_VEL -o /tmp/pixel_deploy_wv32 examples/so101/pixel_student_deploy_real.mojo && /tmp/pixel_deploy_wv32", depends-on = ["build-serial", "build-opencv"], description = "A windowed 32x32 joint-velocity pixel student on the arm (-- --role R; --arm to move it)" }

# ── SmolVLA on the board ───────────────────────────────────────────────────
# ⚠⚠ MEASURE THE QUERY FIRST. `smolvla-probe-jetson` times one `select_action`;
# the deployment's whole loop shape rests on comparing that against the 1.667 s
# of motion one chunk buys. Do not skip it — the ACT deployment's architecture
# came from exactly this measurement, and guessing it here would be picking a
# loop by faith.
#
# ⚠ 3.2 GB of weights, host AND device. One target per binary is not a
# preference; building both would be 6.4 GB.
smolvla-probe-jetson = { cmd = "mojo build -I . --target-accelerator sm_87 -o /tmp/svla_probe examples/so101/smolvla_so101_latency_probe.mojo && /tmp/svla_probe", description = "Time ONE SmolVLA query on the Orin — the prerequisite for the deploy" }
smolvla-deploy-jetson = { cmd = "mojo build -I . --target-accelerator sm_87 -DSMOLVLA_GPU=1 -o /tmp/svla_deploy examples/so101/smolvla_so101_deploy_real.mojo && /tmp/svla_deploy", depends-on = ["build-serial", "build-opencv"], description = "Run a fine-tuned SmolVLA on the SO-101 (-- --ckpt C --stats S; --arm to move it)" }
# The expert attention, five variants, one run — see the file's header for how
# to read it. nsys put `_ba_kernel` at 0.29% of fp32 peak; this says why.
smolvla-attn-bench-jetson = { cmd = "mojo build -I . --target-accelerator sm_87 -o /tmp/attn_bench benchmarks/smolvla_block_attention_bench.mojo && /tmp/attn_bench", description = "SmolVLA expert attention: five kernel variants, timed and gated" }
# The denoising step by stage — the forward twin of the fine-tune's `backward
# by op`. Says whether the expert's 28 ms/step is its linears missing the GEMM
# dispatch at M=50 or the launch floor of ~370 kernels (=> a CUDA graph).
smolvla-denoise-bench-jetson = { cmd = "mojo build -I . --target-accelerator sm_87 -o /tmp/denoise_bench benchmarks/smolvla_denoise_stages_bench.mojo && /tmp/denoise_bench", description = "SmolVLA denoising step: per-stage ms, launch floor, GEMM efficiency" }
# CrossAttention's forward, four variants, at SigLIP's shape AND every ACT shape
# (deploy batch 1, training batch 16, the masked CVAE). The primitive is shared:
# a variant ships only if it is faster for SigLIP and no slower for ACT.
cross-attn-bench-jetson = { cmd = "mojo build -I . --target-accelerator sm_87 -o /tmp/xa_bench benchmarks/cross_attention_bench.mojo && /tmp/xa_bench", description = "CrossAttention: four forward variants at SigLIP + ACT shapes, bit-checked" }
cross-attn-stages-bench-jetson = { cmd = "mojo build -I . --target-accelerator sm_87 -o /tmp/xa_stages_bench benchmarks/cross_attention_stages_bench.mojo && /tmp/xa_stages_bench", description = "CrossAttention forward timed stage by stage, with per-stage candidates, bit-checked" }
attn-matmul-bench-jetson = { cmd = "mojo build -I . --target-accelerator sm_87 -o /tmp/attn_mm_bench benchmarks/attention_matmul_bench.mojo && /tmp/attn_mm_bench", description = "The two attention matmuls: MAX batched_matmul vs tiled kernels, at SigLIP + ACT shapes" }

[feature.amd]

[feature.apple]

[feature.act-ref.dependencies]
# PyTorch, for GATING ONLY. `tools/act/dump_act_reference.py` runs the ACT
# reference (`references/act-main/`) on seeded weights and dumps every
# intermediate activation + parameter to .npy, which the Mojo ACT gates then
# compare against. Nothing under `noeira/` imports torch, and no training or
# inference path depends on this environment — without it the ACT port could
# only be checked against itself, which is not a check.
#   pixi run -e act-ref python tools/act/dump_act_reference.py --out /tmp/act_ref
pytorch = ">=2.5,<3"
torchvision = ">=0.20,<1"
numpy = ">=1.26"
# The REFERENCE safetensors implementation, for gating OURS
# (`noeira/io/safetensors.mojo`). Our writer's files must be readable by the
# library everyone else uses, and our reader must agree with it value-for-value
# on a file that library wrote. A hand-rolled Python check would only re-state
# the same understanding the Mojo code encodes -- two parsers sharing one wrong
# assumption is a gate that cannot see the assumption.
safetensors = ">=0.4,<1"
# The REFERENCE SmolVLM implementation, for gating the SmolVLA port's towers
# (`tools/vla/dump_smolvla_reference.py`). Same argument as the line above, and
# it is the argument that matters most here: every brick of the port is already
# checked against an outside reference, but nothing yet checks that they are
# WIRED TOGETHER right. A hand-rolled torch forward would share this port's
# reading of the architecture and could not see a misreading; HuggingFace's own
# SmolVLM can.
transformers = ">=4.50"

[feature.cpu.dependencies]
# CPU-only environment for CI and headless test runs: base deps WITHOUT the
# CUDA toolchain the `default`/`nvidia` envs pull on linux-64 (GBs of
# cuda-toolkit/cudnn a GitHub runner neither needs nor caches well).
# Python pinned to 3.13 to match the MOJO_PYTHON_LIBRARY activation string.
python = ">=3.13.14,<3.14"

[dependencies]
mojo = "==1.1.0"
max = "==26.6.0"
gymnasium = ">=1.3.0,<2"
# ⚠ DECLARED, NOT TRANSITIVE. `noeira/physics3d/collision/native/nra_qhull.c`
# links libqhull_r to reproduce `mjCMesh::MakeGraph`'s facet ORDER, which is
# what decides every merged polygon's normal (see `collision/qhull_native.mojo`).
# qhull was already present as a transitive dep of another package; relying on
# that would break the mesh pipeline the day that package moved.
qhull = ">=2020.2,<2021"
# Atari ROM support. ale-py ships without ROMs; `pixi run setup-roms` downloads
# the canonical Farama ROM bundle (see scripts/setup_roms.py) and symlinks them.
ale-py = ">=0.12.0,<0.13"           # Arcade Learning Environment (requires ROMs)
pygame = ">=2.6.1,<3"
python = ">=3.12.13,<3.14"
swig = ">=4.4.1,<5"
box2d-py = ">=2.3.8,<3"  # for gymnasium Box2D envs (LunarLander, BipedalWalker, CarRacing)
mujoco = ">=3.12.0,<4"    # for gymnasium MuJoCo envs (HalfCheetah, Ant, Humanoid, etc.)
imageio = ">=2.37.0,<3"
imageio-ffmpeg = ">=0.6.0,<0.7"
# ⚠ DECLARED, NOT TRANSITIVE — the same rule as qhull above. `ffmpeg` reached
# this environment only as a dependency of `imageio-ffmpeg`, and TWO pure-Mojo
# paths now shell out to it: the LeRobot dataset import
# (`noeira/io/video`, `noeira/data/lerobot.mojo`) and screen recording
# (`noeira/render/video_recorder.mojo`). Removing `imageio-ffmpeg` — the
# natural cleanup now that neither imports it — would take `ffmpeg` with it and
# break both, at runtime, on a machine where it used to work.
ffmpeg = ">=7,<9"
# ⚠ DECLARED, NOT TRANSITIVE — the same rule again. libSDL3 (and its headers,
# which `scripts/build_imgui.sh` compiles against) reached this environment
# only because conda-forge's `sdl2` is now sdl2-compat, built on SDL3, pulled
# in by pygame and ffmpeg. `noeira/render/sdl` dlopens it from $CONDA_PREFIX,
# so the docs can say "pixi installs it" — which stops being true the day
# either of those drops sdl2. Ubuntu 24.04 has no SDL3 package to fall back on.
sdl3 = ">=3.2.22,<4"
# Used by `noeira/data/lerobot.mojo` to fetch a dataset from the HuggingFace
# Hub. Present as /usr/bin/curl on macOS and most Linux images, absent from
# slim containers; declared so the import path does not depend on the base
# image.
curl = ">=8,<9"
# ⚠ AND `libcurl`, which is the part that matters now. `noeira/io/http.mojo`
# links the library, not the binary: every HTTP call in the tree — the metrics
# logger, the dataset catalog, the HF downloader, the MNIST loader — is a
# libcurl handle rather than Python `urllib` or a `curl` subprocess. The CLI
# is still worth having on PATH for debugging the same requests by hand.
# `zlib` comes with it and the shim links that too (MNIST's `.gz`).
shaderc = ">=2026.2,<2027"  # for GLSL->SPIR-V shader compilation (cross-platform rendering)
hdf5 = ">=2.1.0,<3"             # libhdf5 C library, FFI target for noeira/io/hdf5
hdf5plugin = ">=7.0.0,<8"          # Blosc/LZ4/ZSTD chunk-compression filters loaded via HDF5_PLUGIN_PATH
h5py = ">=3.16.0,<4"             # used by inspection script + parity test (not by the Mojo loader)
# GATE-ONLY. `examples/g1/bfm_zero_tracking_gate.mojo` runs the RELEASED
# BFM-Zero actor (`FBcprAuxModel.onnx`, CC BY-NC) through Python interop to
# score our G1 physics against the paper's sim-to-sim row; nothing under
# `noeira/` imports it (docs/BFM_ZERO_G1_REPRODUCTION.md, G2).
onnxruntime = ">=1.17"
scipy = ">=1.12"                 # same gate: `linear_sum_assignment` is the reference's `ot.emd2` for uniform weights
# ⚠ GATE-ONLY AS OF THE NATIVE-NET WORK. Nothing under `noeira/` imports
# these three any more: `nn/datasets/cifar10.mojo` reads the HF parquet with
# `io/parquet` + `io/png`, and `nn/datasets/lewm_pusht.mojo` streams its
# `.h5.zst` through libcurl + libzstd in `io/native/nra_http.c`. They stay
# DECLARED because they are the ORACLES those replacements are gated against
# (`tools/io/dump_cifar_reference.py`, `tools/io/make_zstd_fixture.py`) — the
# same rule as `safetensors` above. Removing them would delete the gates, not
# just the dependency.
huggingface_hub = ">=1.24.0,<2"  # reference for the native Hub client
pyarrow = ">=24.0.0,<25"            # read HF parquet datasets (e.g. CIFAR-10 loader)
zstandard = ">=0.25.0,<0.26"        # first-run decompression of .h5.zst envelope

[package]
name = "noeira"
version = "0.1.0"

[package.build]
backend = { name = "pixi-build-mojo", version = "0.1.*" }

[package.host-dependencies]
mojo-compiler = "==1.1.0"

[package.build-dependencies]
mojo-compiler = "==1.1.0"

[package.run-dependencies]
mojo-compiler = "==1.1.0"

# Point Mojo's embedded Python at the *active* env (CONDA_PREFIX), not a hardcoded
# `default` env — otherwise `pixi run -e nvidia/apple` loads the wrong libpython and
# `Python.import_module("max")` fails with "No module named 'max'" when `default`
# isn't installed. Each env carries its own libpython + max.
[target.osx-arm64.activation]
env = { MOJO_PYTHON_LIBRARY = "$CONDA_PREFIX/lib/libpython3.13.dylib" }

[target.linux-64.activation]
env = { MOJO_PYTHON_LIBRARY = "$CONDA_PREFIX/lib/libpython3.13.so" }

[target.linux-aarch64.activation]
env = { MOJO_PYTHON_LIBRARY = "$CONDA_PREFIX/lib/libpython3.13.so" }

[environments]
nvidia = { features = ["nvidia"], solve-group = "nvidia" }
jetson = { features = ["jetson"], solve-group = "jetson" }
amd = { features = ["amd"], solve-group = "amd" }
apple = { features = ["apple"], solve-group = "apple" }
cpu = { features = ["cpu"], solve-group = "cpu" }
# Reference-gate environment only — see [feature.act-ref.dependencies].
act-ref = { features = ["act-ref"], solve-group = "act-ref" }
default = { features = ["nvidia"] }

[tasks]
install-pre-commit = "pre-commit install"
setup-roms = { cmd = "python3 scripts/setup_roms.py", description = "Download Atari 2600 ROMs and symlink roms/ for the emulator" }
build = { cmd = "mojo precompile noeira -o noeira.mojoc" }
# ── the precompiled package (docs/COMPILE_TIME_PROFILING.md §3.1) ──────────
# `Import Mojo` is an uncached per-build floor that scales with the symbols a
# driver references: the SAC HalfCheetah driver pays 32 s of it on EVERY
# rebuild from source, 2.5 s from the package (warm rebuild 38 s -> 8 s on
# 1.0, identical binary). For iterating on a driver, config or example — the
# package is ~3 min and the whole box to rebuild whenever noeira/ changes,
# and `run-pkg` warns when it is stale. See scripts/pkg.sh for the two traps
# it exists to avoid (the source tree shadows the package; shims are found
# from the root).
build-pkg = { cmd = "bash scripts/pkg.sh build", description = "Precompile noeira into build/pkg/ (~3 min, wants the whole box)" }
run-pkg = { cmd = "bash scripts/pkg.sh run", description = "Build a driver against build/pkg/ and run it: run-pkg examples/x.mojo [args]" }
compile-pkg = { cmd = "bash scripts/pkg.sh compile", description = "mojo build a driver against build/pkg/: compile-pkg examples/x.mojo -o out [flags]" }
run = { cmd = "mojo run -I ." }
test = { cmd = "mojo run -I ." }
# Tiered test suites (scripts/run_tests.sh — see its header for details):
#   test-smoke  curated fast CPU gates (tests/manifests/smoke.txt) — the CI
#               tier; self-contained (no references/, no ROMs, no GPU).
#   test-cpu    discover ALL non-GPU tests under tests/ (hours; run before
#               big merges or via the weekly CI cron).
#   test-gpu    discover *_gpu.mojo tests; run as
#               `pixi run -e apple test-gpu` or `pixi run -e nvidia test-gpu`.
test-smoke = { cmd = "bash scripts/run_tests.sh tests/manifests/smoke.txt", description = "Fast curated CPU test tier (CI)" }
examples-compile = { cmd = "bash scripts/run_tests.sh --compile-only tests/manifests/examples-compile.txt", description = "Compile-probe the root examples (CI)" }
test-cpu = { cmd = "bash scripts/run_tests.sh --discover tests --cpu-only", description = "All non-GPU tests (slow)" }
# ACT gates. Needs the torch reference dump + the converted LeRobot store —
# see tests/manifests/act.txt for the two prerequisite commands.
test-act = { cmd = "bash scripts/run_tests.sh tests/manifests/act.txt", description = "ACT reference gates (needs -e act-ref dumps)" }
test-io = { cmd = "bash scripts/run_tests.sh tests/manifests/io.txt", description = "Native parquet / resize / LeRobot-import gates (needs the dumps in tests/manifests/io.txt)" }
test-vision = { cmd = "bash scripts/run_tests.sh tests/manifests/vision.txt", depends-on = ["build-opencv"], description = "The vision gates (OpenCV shim, calibration, capture) — needs the OpenCV shim, so not in test-smoke" }
test-swm = { cmd = "bash scripts/run_tests.sh tests/manifests/swm.txt", description = "SWM-H sheaf world model gates (experimental, CPU)" }
test-fb = { cmd = "bash scripts/run_tests.sh tests/manifests/fb.txt", description = "Forward-Backward zero-shot RL gates (CPU; docs/BFM_ZERO_SHOT_RL.md)" }
test-concurrent = { cmd = "bash scripts/run_tests.sh tests/manifests/concurrent.txt", description = "Concurrency backbone (noeira/core/concurrent): pthread, SPSC ring, atomic cells" }
# Format interop: our safetensors reader/writer against the REFERENCE library,
# and the Hub's ImageNet ResNet18 against torchvision's. Needs `-e act-ref`
# dumps AND the two `--verify` passes listed in the manifest header — half of
# each gate is a file we write and cannot judge ourselves.
test-interop = { cmd = "bash scripts/run_tests.sh tests/manifests/interop.txt", description = "safetensors / torch-name interop gates (needs the dumps in tests/manifests/interop.txt)" }
test-act-gpu = { cmd = "bash scripts/run_tests.sh tests/manifests/act-gpu.txt", description = "ACT GPU-vs-CPU gates (use -e apple|nvidia)" }
test-vla = { cmd = "bash scripts/run_tests.sh tests/manifests/vla.txt", description = "SmolVLA structural gates (name-map coverage; no weights, no network)" }
test-vla-gpu = { cmd = "bash scripts/run_tests.sh tests/manifests/vla-gpu.txt", description = "SmolVLA GPU smokes (vision tower forward/vjp at real shapes)" }
test-vla-weights = { cmd = "bash scripts/run_tests.sh tests/manifests/vla-weights.txt", description = "SmolVLA gates needing the published weights (~907 MB download, cached)" }
