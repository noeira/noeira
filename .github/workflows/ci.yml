name: ci

# Cost/duration model (public repo → standard runners are free):
#   * per-push/PR: `model-dims` and `examples-compile`.
#   * per-PR only: `smoke` — a curated CPU manifest (tests/manifests/smoke.txt)
#     that takes ~50 min, too long for every push to dev. Run it on a branch
#     with `workflow_dispatch` (tier: smoke).
#   * weekly cron: the full non-GPU discovery sweep (hours) — catches rot in
#     the long tail without taxing every push.
#   * GPU tests never run here (no free GPU runners) — `pixi run -e apple|
#     nvidia test-gpu` stays a local/NVIDIA-box task.
# The pixi env is cached by setup-pixi keyed on pixi.lock, so steady-state
# runs skip the toolchain download.

on:
  push:
    branches: [dev, main]
    paths-ignore:
      - "**.md"
      - "**.gif"
      - "**.png"
      - "docs/**"
  pull_request:
    paths-ignore:
      - "**.md"
      - "**.gif"
      - "**.png"
      - "docs/**"
  schedule:
    # Weekly full CPU sweep (Sunday 03:17 UTC — off-peak, odd minute to
    # avoid the on-the-hour scheduling crunch).
    - cron: "17 3 * * 0"
  workflow_dispatch:
    inputs:
      tier:
        description: "Which tier to run"
        type: choice
        default: smoke
        options: [smoke, cpu-full]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# The workspace declares linux-64 only as `{ platform = "linux-64", cuda = "12" }`
# (lock name `linux-64-cuda-12`), so the lock was solved with `__cuda=12` and the
# cpu env's linux-64 packages carry it (onnxruntime's cuda129 build pulls
# cuda-cudart / cuda-nvrtc). A GitHub runner has no GPU, so pixi finds no
# platform it can run and `pixi install -e cpu --locked` stops at
# `unsupported-platform: missing virtual packages: __cuda >= 12`. Mocking the
# virtual package installs the locked env as-is; nothing in the CPU tiers
# opens a CUDA device.
env:
  CONDA_OVERRIDE_CUDA: "12.0"

jobs:
  smoke:
    if: github.event_name == 'pull_request' || (github.event_name == 'workflow_dispatch' && inputs.tier == 'smoke')
    runs-on: ubuntu-latest
    # ⚠ The manifest budgets ~15 min; its first full run on a runner
    # (2026-10-26, 101 files) took 58.5 — inside 60 only by luck.
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: prefix-dev/setup-pixi@v0.9.4
        with:
          environments: cpu
          cache: true
          cache-write: false
      # The http and serial shims are dlopen'd by a dozen smoke tests and are
      # not in git (`scripts/build_http.sh`, `scripts/build_serial.sh`).
      - name: build the native shims
        run: pixi run -e cpu build-http && pixi run -e cpu build-serial
      - name: smoke tier
        run: pixi run -e cpu test-smoke

  model-dims:
    # The comptime model dimensions are GENERATED from the .xml assets through
    # MuJoCo. A stale generated file is silent by construction: the counts still
    # compile, they just size the slabs for a model that no longer exists. This
    # is seconds, so it runs on every push.
    # ⚠ The LIBERO scenes' meshes are not in git
    # (`noeira/envs/libero/assets.kv` declares the pack), and MuJoCo cannot
    # load those scenes without them, so the pack is pulled first — through
    # the same tool and sha256 as any box.
    if: github.event_name != 'schedule' && (github.event_name != 'workflow_dispatch' || inputs.tier == 'smoke')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: prefix-dev/setup-pixi@v0.9.4
        with:
          environments: cpu
          cache: true
          # The one job that writes the pixi cache: it runs on every push to
          # dev, and a cache a PR writes is visible to that PR only.
          cache-write: ${{ github.event_name == 'push' && github.ref == 'refs/heads/dev' }}
      # assets-pull downloads through the http shim (not in git).
      - name: pull the LIBERO asset pack
        run: pixi run -e cpu build-http && pixi run -e cpu assets-pull libero
      - name: generated dims are up to date
        run: pixi run -e cpu gen-dims-check

  examples-compile:
    if: github.event_name != 'schedule' && (github.event_name != 'workflow_dispatch' || inputs.tier == 'smoke')
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: prefix-dev/setup-pixi@v0.9.4
        with:
          environments: cpu
          cache: true
          cache-write: false
      - name: compile-probe root examples
        run: pixi run -e cpu examples-compile

  cpu-full:
    if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.tier == 'cpu-full')
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
      - uses: prefix-dev/setup-pixi@v0.9.4
        with:
          environments: cpu
          cache: true
          cache-write: false
      - name: build the native shims
        run: pixi run -e cpu build-http && pixi run -e cpu build-serial
      - name: full CPU sweep
        # Discovery over tests/ minus *_gpu.mojo. Some of the long tail needs
        # local-only assets (references/, ROMs) and will fail on CI — the
        # summary still tells you WHAT is red and whether it changed week to
        # week. continue-on-error keeps the cron from paging you red every
        # Sunday while the tail gets cleaned up; flip it off once test-cpu
        # is green.
        continue-on-error: true
        run: pixi run -e cpu test-cpu
