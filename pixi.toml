# Record DEMONSTRATIONS in the sim (HIL-SERL): the leader drives the simulated
# tower scene, the family's reward is paid on the host, episodes land in a
# `.demo` file that `sac_tower_gpu.mojo --demos F` samples half of every batch
# from. ⚠ NEVER ENERGISES AN ARM: the leader is read with torque off. Pass
# `-- <task> [--policy CKPT] [--out F] [--keep-failures] [--no-arm]`.
soarm-tower-record = { cmd = "mojo run -I . examples/so101/tower_teleop_record.mojo", depends-on = ["build-serial", "build-imgui"], description = "Record so101_tower demonstrations from the leader arm in the sim (-- <task> [--policy CKPT]); `--no-arm` for a policy-only run" }
# A scripted expert (waypoints + IK on the CPU env) that picks the cube and
# lifts it / places it in the bowl on randomised placements, HEADLESS, writing
# `.demo` files for `sac_tower_gpu.mojo --demos`. `-- [task] --episodes N --noise S`.
soarm-tower-expert = { cmd = "mojo run -I . examples/so101/tower_expert_record.mojo", description = "Generate so101_tower demonstrations with a scripted IK expert (-- [task] --episodes N --noise SIGMA --seed S)" }
soarm-tower-replay = { cmd = "mojo run -I . examples/so101/tower_demo_viewer.mojo", depends-on = ["build-imgui"], description = "Replay a so101_tower .demo file in the 3D viewer, posed from the recorded states (-- FILE.demo [--episode K] [--speed X] [--loop])" }
soarm-tower-probe = { cmd = "mojo run -I . examples/so101/tower_policy_probe.mojo", description = "Probe a so101_tower SAC checkpoint: teacher-forced L1 on a .demo file, closed-loop episodes from fresh placements, step-by-step replay of one demo (-- --ckpt F --demos F [--replay-episode K [--open-loop]])" }
soarm-tower-rerender = { cmd = "mojo run -I . examples/so101/tower_demo_rerender.mojo", description = "Render so101_tower .demo files through the rig's two cameras into an ACT store in the real dataset's layout (LeRobot units, overhead + wrist 240x320) (-- --demos a.demo[,b.demo] [--out F] [--episodes N])" }
soarm-tower-preview = { cmd = "mojo run -I . examples/so101/tower_camera_preview.mojo", description = "Render the so101_tower family's wrist and overhead cameras at a recorded state (-- --state deg,.. --out-dir DIR)" }
soarm-calibrate-extrinsics = { cmd = "mojo run -I . examples/so101/calibrate_camera_extrinsics.mojo", depends-on = ["build-serial", "build-opencv", "build-imgui"], description = "Fit the camera -> robot-base transform (never energises the arm)" }
# Run a trained ACT policy on the follower, from the two live cameras.
# ⚠ SAFE BY DEFAULT: without `--arm` nothing is energised. `--store` is
# REQUIRED (the normalization statistics live there, not in the checkpoint).
# ⚠ `build` + run rather than `mojo run`: this example needs `-ld_classic`,
# and a 3-minute compile in front of a robot should be a separate step you can
# see finish. Extra args append, so `-- --store X --snap /tmp/snap` works.
soarm-act-deploy = { cmd = "mojo build -I . -Xlinker -ld_classic -o /tmp/act_deploy examples/so101/act_so101_deploy_real.mojo && /tmp/act_deploy", depends-on = ["build-serial", "build-opencv"], description = "Run trained ACT on the SO-101 (-- --project P --role act; --arm to move it)" }
# ⚠⚠ WRITES SERVO EEPROM. Safe by default (no --write); ALWAYS --backup first.
soarm-calibrate = { cmd = "mojo run -I . tools/soarm/so101_calibrate.mojo", depends-on = ["build-serial"], description = "Calibrate an SO-101 arm (needs --port; --write to apply)" }
# NVIDIA GPU information and profiling utilities
gpu-info = { cmd = "nvidia-smi --query-gpu=name,compute_cap,memory.total,driver_version --format=csv", description = "Get basic GPU information" }

# GPU specs
gpu-specs = { cmd = "python3 scripts/gpu_specs.py", description = "Get complete GPU architectural specifications (NVIDIA/AMD/Apple Silicon)" }

# Shader compilation
compile-shaders = { cmd = "bash noeira/render/shaders/compile.sh", description = "Compile GLSL shaders to SPIR-V bytecode" }

# macOS
check-macos = { cmd = "sw_vers -productVersion | awk -F. '{if($1<15) {print \"Error: macOS 15+ required, found \" $0; exit 1}}'", description = "Ensure macOS 15+" }
